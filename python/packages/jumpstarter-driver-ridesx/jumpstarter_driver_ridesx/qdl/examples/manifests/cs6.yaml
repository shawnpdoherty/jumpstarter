name: "SA8650P CS6 Firmware"
description: "CS6 (8650 ADAS) QDL flash workflow"
data:
  folder: "r00012.1"
  extract_to_folder: true
  abl_image: "ufs/sa8650-adas-abl.elf"
  cdt_image:
    v1: "ufs/LEMANSAU_QAM_1.1.0.bin"
    v2: "ufs/LEMANSAU_QAM_1.1.0.bin"
    v3: "ufs/LEMANSAU_QAM_1.2.0.bin"
    v4: "ufs/LEMANSAU_QAM_1.2.0.bin"
steps:
  - set_mode: edl
    check_dmesg: "idProduct=9008"

  - sleep: 5

  - name: "UFS provisioning"
    retry_mode: edl
    qdl:
      storage: ufs
      programmer: prog_firehose_ddr.elf
      files:
        - provision_default.xml

  - sleep: 10

  - set_mode: edl
    check_dmesg: "idProduct=9008"

  - name: "Flash UFS"
    retry_mode: edl
    qdl:
      storage: ufs
      programmer: prog_firehose_ddr.elf
      files:
        - "rawprogram*.xml"
        - "patch*.xml"

  - sleep: 30

  - set_mode: fastboot

  - name: "check fastboot device"
    retry_mode: fastboot
    fastboot:
      continue: false
